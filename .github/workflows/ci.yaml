name: CI

on:
  pull_request:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Go Mod Download
      run: go mod download
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.14.0
        args: "--timeout 5m -v"

  check-license:
    name: Check License
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Go Mod Download
      run: go mod download
    - name: Install addlicense
      run: go install -mod=readonly github.com/google/addlicense@v1.2.0
    - name: Check license headers
      run: |
        addlicense -check -l mit -f ./LICENSE -c "FLYR, Inc" $(find . -type f -name "*.go")

  go-sec:
    name: GoSec
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Go Mod Download
      run: go mod download
    - name: Run Gosec Security Scanner
      uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
    - name: Upload GoSec scan to GitHub Security
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: gosec-results.sarif
    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: upload-artifact
      with:
        name: sonar-reports-gosec
        path: gosec-results.sarif

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run Trivy vulnerability scanner filesystem
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: '.'
        hide-progress: false
        format: "sarif"
        output: "trivy-results-fs.sarif"
        trivyignores: .trivyignore
    - name: Upload Trivy scan to GitHub Security
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: trivy-results-fs.sarif
    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: upload-artifact
      with:
        name: sonar-reports-trivy-fs
        path: trivy-results-fs.sarif

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Go Mod Download
      run: go mod download
    - name: Run Unit Tests
      continue-on-error: true
      run: |
        go run gotest.tools/gotestsum@v1.13.0 --junitfile report.xml --jsonfile test-results.json -- -coverprofile coverage.out ./...
    - name: Convert Unit Tests
      continue-on-error: true
      run: |
        go run github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@v0.3.0 -output ctrf-report.json < test-results.json
    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: upload-test-results
      with:
        name: sonar-reports-test-results
        path: |
          test-results.json
          report.xml
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: upload-coverage
      with:
        name: sonar-reports-coverage
        path: coverage.out
    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
      with:
        report-path: ctrf-report.json
        group-by: suite
        summary-report: true
        failed-report: true
        flaky-report: true
        skipped-report: true
        suite-folded-report: true
        exit-on-fail: true

  sonar-cloud:
    name: Run SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, trivy, go-sec]
    if: github.actor != 'dependabot[bot]' && (success() || failure())
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Download Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: sonar-reports-*
        merge-multiple: true
        path: sonar-reports
    - name: Get Version
      id: version
      run: echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
    - name: Get Reports
      id: get-reports
      run: |
        SARIF_FILES=""
        for file in $(find sonar-reports -name '*.sarif'); do
          if [ -z "$SARIF_FILES" ]; then
            SARIF_FILES="$file"
          else
            SARIF_FILES="$SARIF_FILES,$file"
          fi
        done
        echo "sarif_files=$SARIF_FILES" >> "$GITHUB_OUTPUT"
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.go.coverage.reportPaths=sonar-reports/coverage.out
          -Dsonar.go.tests.reportPaths=sonar-reports/unit-test-results.json
          -Dsonar.sarifReportPaths=${{ steps.get-reports.outputs.sarif_files }}
          -Dsonar.projectVersion=${{ steps.version.outputs.version }}
